services:
  # ==========================================
  # 1. 消息中间件：Apache 官方 Kafka (KRaft 单节点)
  # ==========================================
  kafka:
    image: apache/kafka:latest
    container_name: bigdata-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 内部控制器通信与外部客户端通信的端口绑定
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # 告诉宿主机 Python/Flink 通过 localhost:9092 访问
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 单机模式必须将副本数设为 1，否则会报错
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 限制内存，防止卡顿
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xmx512m -Xms512m"
    networks:
      - bigdata-network

  # ==========================================
  # 2. 数据湖底座：MinIO
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: bigdata-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    command: server /data --console-address ":9001"
    networks:
      - bigdata-network

networks:
  bigdata-network:
    driver: bridge